```html
<!DOCTYPE html>
<html lang="pt-br">

<head>

    <title>🌙LUA🌙</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <style>

        /* =========================
           CORPO DA PÁGINA
        ========================= */

        body {
            font-family: Arial, sans-serif;

            background-color: #ffffff;

            color: white;

            margin: 0;

            padding: 20px;

            min-height: 100vh;

            box-sizing: border-box;

            overflow-x: auto;
        }


        /* =========================
           MENU
        ========================= */

        header {
            width: 100%;
        }

        header ul {
            margin: 0;
            padding: 0;

            list-style: none;

            display: flex;

            justify-content: center;

            gap: 20px;
        }

        header li {
            display: inline-block;
        }

        header a {
            color: black;

            text-decoration: none;

            font-weight: bold;
        }


        /* =========================
           TITULO
        ========================= */

        h1 {
            margin-top: 20px;

            text-align: center;

            color: black;
        }


        /* =========================
           CONTROLES
        ========================= */

        .controls {

            background: rgba(0, 0, 0, 0.3);

            padding: 15px;

            border-radius: 8px;

            display: flex;

            gap: 15px;

            align-items: center;

            flex-wrap: wrap;

            margin: 0 auto 15px auto;

            width: fit-content;

            justify-content: center;

            box-sizing: border-box;
        }


        /* =========================
           CORES
        ========================= */

        .color-picker {

            display: flex;

            gap: 10px;
        }


        .color-btn {

            width: 30px;

            height: 30px;

            border-radius: 50%;

            border: 2px solid white;

            cursor: pointer;

            transition: transform 0.2s;
        }


        .color-btn:hover {

            transform: scale(1.2);
        }


        .color-btn.active {

            border: 3px solid #f1c40f;

            transform: scale(1.1);
        }


        /* =========================
           BOTÕES
        ========================= */

        button {

            padding: 8px 16px;

            border: none;

            border-radius: 4px;

            cursor: pointer;

            font-weight: bold;

            color: white;
        }


        #clear-btn {

            background-color: #e74c3c;
        }


        #clear-btn:hover {

            background-color: #c0392b;
        }


        #save-btn {

            background-color: #27ae60;
        }


        #save-btn:hover {

            background-color: #219150;
        }


        #load-btn {

            background-color: #3498db;
        }


        #load-btn:hover {

            background-color: #2980b9;
        }


        /* =================================================
           LAYOUT PRINCIPAL
           
           GRADE DE UM LADO
           ANOTAÇÕES DO OUTRO
        ================================================= */

        .main-container {

            display: flex;

            flex-direction: row;

            align-items: flex-start;

            justify-content: center;

            gap: 40px;

            width: max-content;

            margin: 0 auto;
        }


        /* =========================
           COLUNA DA GRADE
        ========================= */

        .board-column {

            flex: 0 0 auto;

            display: flex;

            flex-direction: column;

            align-items: flex-start;
        }


        /* =================================================
           GRADE 30 × 30
           
           30 COLUNAS
           30 LINHAS
           TOTAL = 900 SLOTS
        ================================================= */

        .grid-container {

            display: grid;

            grid-template-columns: repeat(30, 30px);

            grid-template-rows: repeat(30, 30px);

            gap: 2px;

            background-color: #34495e;

            padding: 5px;

            border-radius: 4px;

            box-shadow:
                0 10px 20px rgba(0, 0, 0, 0.5);

            width: max-content;

            height: max-content;

            flex-shrink: 0;
        }


        /* =========================
           CADA SLOT
        ========================= */

        .cell {

            background-color: #ecf0f1;

            width: 30px;

            height: 30px;

            cursor: pointer;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            box-sizing: border-box;

            flex-shrink: 0;
        }


        .cell:hover {

            background-color: #bdc3c7;
        }


        /* =========================
           TOKENS
        ========================= */

        .token {

            width: 24px;

            height: 24px;

            border-radius: 50%;

            box-shadow:
                0 4px 6px rgba(0, 0, 0, 0.3);

            border:
                2px solid rgba(255, 255, 255, 0.5);

            cursor: pointer;

            transition: transform 0.1s;

            box-sizing: border-box;
        }


        .token:hover {

            transform: scale(1.1);
        }


        /* =========================
           CORES DOS TOKENS
        ========================= */

        .token.red {

            background-color: #e74c3c;
        }


        .token.blue {

            background-color: #3498db;
        }


        .token.green {

            background-color: #2ecc71;
        }


        .token.yellow {

            background-color: #f1c40f;
        }


        .token.purple {

            background-color: #9b59b6;
        }


        .token.orange {

            background-color: #e67e22;
        }


        /* =========================
           COLUNA DAS ANOTAÇÕES
        ========================= */

        .notes-column {

            flex: 0 0 400px;

            width: 400px;

            display: flex;

            flex-direction: column;

            padding-top: 0;
        }


        /* =========================
           TITULO DAS ANOTAÇÕES
        ========================= */

        .notes-header {

            margin-bottom: 10px;

            font-weight: bold;

            color: #2c3e50;

            font-size: 18px;
        }


        /* =========================
           ÁREA DE ANOTAÇÕES
        ========================= */

        .notes-area {

            background-color: #ecf0f1;

            color: #2c3e50;

            border: none;

            border-radius: 8px;

            padding: 15px;

            font-family:
                'Courier New',
                Courier,
                monospace;

            font-size: 14px;

            resize: vertical;

            width: 400px;

            min-height: 500px;

            box-shadow:
                0 4px 6px rgba(0, 0, 0, 0.3);

            box-sizing: border-box;
        }


        .notes-area:focus {

            outline: 2px solid #3498db;
        }


        /* =========================
           INPUT DE ARQUIVO
        ========================= */

        #file-input {

            display: none;
        }


    </style>

</head>


<body>


    <!-- =========================
         MENU
    ========================= -->

    <header>

        <ul>

            <li>
                <a href="index.html">
                    Principio
                </a>
            </li>

            <li>
                <a href="LuaCrescente.html">
                    Personagens
                </a>
            </li>

            <li>
                <a href="LuaMinguante.html">
                    Grimório
                </a>
            </li>

            <li>
                <a href="LuaNova.html">
                    Mundo
                </a>
            </li>

            <li>
                <a href="LuaCheia.html">
                    Combate
                </a>
            </li>

        </ul>

    </header>


    <h1>
        Confronto
    </h1>


    <!-- =========================
         CONTROLES
    ========================= -->

    <div class="controls">


        <div class="color-picker">


            <div
                class="color-btn red active"
                onclick="selectColor('red')">
            </div>


            <div
                class="color-btn blue"
                onclick="selectColor('blue')">
            </div>


            <div
                class="color-btn green"
                onclick="selectColor('green')">
            </div>


            <div
                class="color-btn yellow"
                onclick="selectColor('yellow')">
            </div>


            <div
                class="color-btn purple"
                onclick="selectColor('purple')">
            </div>


            <div
                class="color-btn orange"
                onclick="selectColor('orange')">
            </div>


        </div>


        <button
            id="clear-btn"
            onclick="clearBoard()">

            Limpar Tabuleiro

        </button>


        <button
            id="save-btn"
            onclick="saveGame()">

            Salvar Jogo

        </button>


        <button
            id="load-btn"
            onclick="document.getElementById('file-input').click()">

            Carregar Jogo

        </button>


        <input
            type="file"
            id="file-input"
            accept=".json"
            onchange="loadGame(this)"
        >


    </div>


    <!-- =================================================
         ÁREA PRINCIPAL
         
         GRADE ←→ ANOTAÇÕES
    ================================================= -->

    <div class="main-container">


        <!-- =========================
             TABULEIRO
        ========================= -->

        <div class="board-column">


            <div
                class="grid-container"
                id="grid">

            </div>


        </div>


        <!-- =========================
             ANOTAÇÕES
        ========================= -->

        <div class="notes-column">


            <div class="notes-header">

                Anotações de Combate

            </div>


            <textarea
                id="combat-notes"
                class="notes-area"
                placeholder="Ex:
Iniciativa:
1. Goblins (Vermelho) - 12
2. Guerreiro (Azul) - 15

HP:
Goblin 1: 10/10
Goblin 2: 5/10

Anotações:
O Goblin 2 está escondido atrás da caixa."
            ></textarea>


        </div>


    </div>


    <script>


        /* =================================================
           CONFIGURAÇÃO
           
           30 × 30 = 900 SLOTS
        ================================================= */

        const gridSize = 30;


        const gridContainer =
            document.getElementById('grid');


        const notesArea =
            document.getElementById('combat-notes');


        let currentColor = 'red';



        /* =================================================
           CRIAR GRADE
        ================================================= */

        function createGrid() {


            gridContainer.innerHTML = '';


            /*
                30 × 30

                30 slots na horizontal
                30 slots na vertical

                TOTAL:
                900 SLOTS
            */

            for (
                let i = 0;
                i < gridSize * gridSize;
                i++
            ) {


                const cell =
                    document.createElement('div');


                cell.classList.add('cell');


                cell.addEventListener(
                    'click',
                    function() {

                        handleCellClick(this);

                    }
                );


                gridContainer.appendChild(cell);

            }

        }



        /* =================================================
           CLIQUE NO SLOT
        ================================================= */

        function handleCellClick(cell) {


            if (cell.hasChildNodes()) {


                /* Remove o token */

                cell.innerHTML = '';


            }

            else {


                /* Cria um novo token */

                const token =
                    document.createElement('div');


                token.classList.add(
                    'token',
                    currentColor
                );


                cell.appendChild(token);

            }

        }



        /* =================================================
           SELECIONAR COR
        ================================================= */

        function selectColor(color) {


            currentColor = color;


            const buttons =
                document.querySelectorAll(
                    '.color-btn'
                );


            buttons.forEach(
                btn => {

                    btn.classList.remove(
                        'active'
                    );

                }
            );


            document
                .querySelector(
                    `.color-btn.${color}`
                )
                .classList.add('active');

        }



        /* =================================================
           LIMPAR TABULEIRO
        ================================================= */

        function clearBoard() {


            if (
                confirm(
                    "Tem certeza que deseja limpar o tabuleiro?"
                )
            ) {


                const cells =
                    document.querySelectorAll(
                        '.cell'
                    );


                cells.forEach(
                    cell => {

                        cell.innerHTML = '';

                    }
                );

            }

        }



        /* =================================================
           SALVAR JOGO
        ================================================= */

        function saveGame() {


            const cells =
                document.querySelectorAll(
                    '.cell'
                );


            const boardState = [];


            cells.forEach(
                cell => {


                    if (cell.hasChildNodes()) {


                        const token =
                            cell.querySelector(
                                '.token'
                            );


                        const colorClass =
                            token.classList[1];


                        boardState.push(
                            colorClass
                        );


                    }

                    else {


                        boardState.push(null);

                    }

                }
            );


            const notes =
                notesArea.value;


            const gameData = {

                board: boardState,

                notes: notes

            };


            const dataStr =
                "data:text/json;charset=utf-8," +
                encodeURIComponent(
                    JSON.stringify(gameData)
                );


            const downloadAnchorNode =
                document.createElement('a');


            downloadAnchorNode.setAttribute(
                "href",
                dataStr
            );


            downloadAnchorNode.setAttribute(
                "download",
                "rpg_combate.json"
            );


            document.body.appendChild(
                downloadAnchorNode
            );


            downloadAnchorNode.click();


            downloadAnchorNode.remove();

        }



        /* =================================================
           CARREGAR JOGO
        ================================================= */

        function loadGame(inputElement) {


            const file =
                inputElement.files[0];


            if (!file) return;


            const reader =
                new FileReader();


            reader.onload =
                function(e) {


                    try {


                        const gameData =
                            JSON.parse(
                                e.target.result
                            );


                        /* Restaurar tabuleiro */

                        const cells =
                            document.querySelectorAll(
                                '.cell'
                            );


                        cells.forEach(
                            (cell, index) => {


                                cell.innerHTML = '';


                                if (
                                    gameData.board[index]
                                ) {


                                    const token =
                                        document.createElement(
                                            'div'
                                        );


                                    token.classList.add(
                                        'token',
                                        gameData.board[index]
                                    );


                                    cell.appendChild(
                                        token
                                    );

                                }

                            }
                        );


                        /* Restaurar anotações */

                        if (gameData.notes) {

                            notesArea.value =
                                gameData.notes;

                        }


                        alert(
                            "Jogo carregado com sucesso!"
                        );


                    }

                    catch (error) {


                        alert(
                            "Erro ao carregar o arquivo. Verifique se é um arquivo válido."
                        );


                        console.error(error);

                    }

                };


            reader.readAsText(file);


            /* Permite carregar o mesmo arquivo novamente */

            inputElement.value = '';

        }



        /* =================================================
           INICIAR
        ================================================= */

        createGrid();


    </script>


</body>

</html>
```
